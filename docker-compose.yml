services:
  postgres:
    image: postgres:16
    container_name: peoplehub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peoplehub}
      POSTGRES_USER: ${POSTGRES_USER:-peoplehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peoplehub} -d ${POSTGRES_DB:-peoplehub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./app/backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-peoplehub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-peoplehub}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    build:
      context: ./app/backend
    container_name: peoplehub-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-peoplehub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-peoplehub}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PEOPLEHUB_ADMIN_EMAIL: ${PEOPLEHUB_ADMIN_EMAIL:-admin@peoplehub.com}
      PEOPLEHUB_ADMIN_PASSWORD: ${PEOPLEHUB_ADMIN_PASSWORD:?Set PEOPLEHUB_ADMIN_PASSWORD in .env}
      PEOPLEHUB_HR_EMAIL: ${PEOPLEHUB_HR_EMAIL:-hr@peoplehub.com}
      PEOPLEHUB_HR_PASSWORD: ${PEOPLEHUB_HR_PASSWORD:?Set PEOPLEHUB_HR_PASSWORD in .env}
      PEOPLEHUB_EMPLOYEE_EMAIL: ${PEOPLEHUB_EMPLOYEE_EMAIL:-employee@peoplehub.com}
      PEOPLEHUB_EMPLOYEE_PASSWORD: ${PEOPLEHUB_EMPLOYEE_PASSWORD:?Set PEOPLEHUB_EMPLOYEE_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: