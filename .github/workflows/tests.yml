name: PeopleHub Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      API_BASE_URL: http://127.0.0.1:8000
      POSTGRES_DB: peoplehub
      POSTGRES_USER: peoplehub
      POSTGRES_PASSWORD: ci-postgres-password
      SECRET_KEY: ci-secret-key-for-github-actions
      PEOPLEHUB_ADMIN_EMAIL: admin@peoplehub.com
      PEOPLEHUB_ADMIN_PASSWORD: ci-admin-password
      PEOPLEHUB_HR_EMAIL: hr@peoplehub.com
      PEOPLEHUB_HR_PASSWORD: ci-hr-password
      PEOPLEHUB_EMPLOYEE_EMAIL: employee@peoplehub.com
      PEOPLEHUB_EMPLOYEE_PASSWORD: ci-employee-password
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation/requirements.txt

      - name: Start backend and database
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Seed test data
        run: docker compose exec -T backend python -m app.seed

      - name: Run API tests
        run: |
          python -m pytest automation/tests/api \
            -n 4 \
            --alluredir=allure-results \
            --junitxml=report.xml

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload API test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            allure-results/
            report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Stop backend and database
        if: always()
        run: docker compose down -v --remove-orphans

  web-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Web tests
        id: web-tests
        shell: bash
        run: |
          if find automation/tests/web -type f -name 'test_*.py' \
            -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Web tests found; skipping Playwright tests."
          fi

      - name: Set up Python
        if: steps.web-tests.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Set up Node.js
        if: steps.web-tests.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Python dependencies
        if: steps.web-tests.outputs.exists == 'true'
        run: python -m pip install -r automation/requirements.txt

      - name: Install frontend dependencies
        if: steps.web-tests.outputs.exists == 'true'
        working-directory: app/frontend
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.web-tests.outputs.exists == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Build frontend
        if: steps.web-tests.outputs.exists == 'true'
        working-directory: app/frontend
        run: npm run build

      - name: Run Playwright tests
        if: steps.web-tests.outputs.exists == 'true'
        run: |
          python -m pytest automation/tests/web \
            --alluredir=allure-results \
            --junitxml=web-report.xml

      - name: Upload Web test artifacts
        if: always() && steps.web-tests.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: |
            allure-results/
            web-report.xml
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [api-tests, web-tests]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load previous Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download API test results
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: artifacts/api-test-results

      - name: Download Web test results
        if: needs.web-tests.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-test-results
          path: artifacts/web-test-results

      - name: Combine Allure results
        shell: bash
        run: |
          mkdir -p allure-results gh-pages

          find artifacts/api-test-results/allure-results \
            -maxdepth 1 -type f -exec cp -n {} allure-results/ \; 2>/dev/null || true

          find artifacts/web-test-results/allure-results \
            -maxdepth 1 -type f -exec cp -n {} allure-results/ \; 2>/dev/null || true

          if ! find allure-results -maxdepth 1 -type f -name '*-result.json' \
            -print -quit | grep -q .; then
            echo "No Allure test results were found."
            exit 1
          fi

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.7.0
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Publish Allure report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
